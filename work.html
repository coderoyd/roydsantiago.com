<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Work — Studio Royd</title>
  <meta name="description" content="Studio Royd's product renders and animations.">
  <link rel="icon" href="img/royd-icon.svg?v=3" type="image/svg+xml">
  <!-- PNG copies of the logo for browsers that skip SVG icons (iPhone Safari showed a globe).
       The iPhone one is on white: iOS fills see-through areas with black. -->
  <link rel="icon" href="img/royd-icon-96.png?v=1" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=1">
  <link rel="preload" href="fonts/DMSans-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <!-- Bump ?v= after editing CSS/JS so browsers (and phones) don't keep the old copy. -->
  <link rel="stylesheet" href="css/style.css?v=93">
</head>
<body>

  <header class="bar">
    <a class="brand" href="index.html" aria-label="Studio Royd, home">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand-name">Studio Royd</span>
    </a>
    <nav class="nav" aria-label="Pages">
      <a href="work.html" aria-current="page">Work</a>
      <a href="services.html">Services</a>
      <a href="index.html">Demo</a>
      <a href="info.html">Info</a>
    </nav>
  </header>

  <!-- Placeholder until the project pages are ready: a wall of small looping thumbnails of past
       work drifting up behind the message (js/work.js; clips and stills in media/work/).
       They're faded and come up to full strength under the mouse. -->
  <main class="page">

    <section class="wall" id="work">
      <div class="pins" aria-hidden="true"></div>
      <div class="wall-msg">
        <h1>Still rendering.</h1>
        <p>A closer look at each project is on its way.</p>
      </div>
    </section>

    <footer class="foot">
      <!-- Brand animation, once when the footer comes into view: the asterisk turns into the r·yd wordmark and back. -->
      <video class="logo-anim" src="media/logo-anim-return.mp4" poster="media/logo-anim-poster.webp"
             muted playsinline preload="auto" role="img" aria-label="Studio Royd"></video>
      <span class="mono small">© 2026 Studio Royd</span>
    </footer>
  </main>

  <script src="js/work.js?v=92"></script>
  <!-- main.js finds no frame sequences here; it only plays the footer logo. -->
  <script src="js/main.js?v=93"></script>
</body>
</html>
